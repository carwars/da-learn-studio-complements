idden="true"></div><h1>Passez en mode paysage</h1><p>Tournez votre smartphone à l’horizontale pour profiter pleinement des illustrations.</p></div><script>
(()=>{'use strict';const slides=[{"file": "DA_Complements_00_Introduction.webp", "name": "Introduction", "alt": "Les compléments essentiels"}, {"file": "DA_Complements_01_Whey_Isolate.webp", "name": "Whey isolate", "alt": "La whey isolate et la synthèse protéique"}, {"file": "DA_Complements_02_Creatine.webp", "name": "Créatine monohydrate", "alt": "La créatine et les efforts intenses"}, {"file": "DA_Complements_03_Omega_3.webp", "name": "Oméga-3", "alt": "Les oméga-3 EPA et DHA"}, {"file": "DA_Complements_04_Multivitamines.webp", "name": "Multivitamines", "alt": "Les multivitamines et les micronutriments"}, {"file": "DA_Complements_05_Magnesium.webp", "name": "Magnésium", "alt": "Le magnésium et le système neuromusculaire"}, {"file": "DA_Complements_06_Potassium.webp", "name": "Potassium", "alt": "Le potassium et la transmission nerveuse"}, {"file": "DA_Complements_07_Collagene.webp", "name": "Collagène", "alt": "Le collagène, les tendons, les ligaments et les tissus conjonctifs"}, {"file": "DA_Complements_08_Creme_de_Riz.webp", "name": "Crème de riz", "alt": "La crème de riz, source de glucides, et les réserves de glycogène musculaire"}, {"file": "DA_Complements_09_Synthese.webp", "name": "Synthèse", "alt": "Synthèse des huit produits : whey isolate, créatine, oméga-3, multivitamines, magnésium, potassium, collagène et crème de riz"}];let current=0;const $=id=>document.getElementById(id);const img=$('slide'),prev=$('prev'),next=$('next'),home=$('home'),counter=$('counter'),fs=$('fullscreen');function render(){const s=slides[current];img.src=s.file;img.alt=s.alt;counter.textContent=`${current+1} / ${slides.length}`;counter.setAttribute('aria-label',`Illustration ${current+1} sur ${slides.length}`);prev.disabled=current===0;next.disabled=current===slides.length-1;home.disabled=current===0;document.title=`${s.name} | DA Compléments`;$('announce').textContent=`${s.name}, illustration ${current+1} sur ${slides.length}`;}function go(n){if(n<0||n>=slides.length||n===current)return;current=n;render();}prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));home.addEventListener('click',()=>go(0));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(slides.length-1)}});async function lockLandscape(){try{if(screen.orientation&&typeof screen.orientation.lock==='function')await screen.orientation.lock('landscape')}catch(e){}}fs.addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();await lockLandscape()}else{await document.exitFullscreen()}}catch(e){console.info('Plein écran non disponible.')}});document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;fs.setAttribute('aria-label',on?'Quitter le plein écran':'Activer le plein écran');fs.title=on?'Quitter le plein écran':'Activer le plein écran';if(on)lockLandscape();else{try{screen.orientation?.unlock?.()}catch(e){}}});for(const s of slides.slice(1)){const preload=new Image();preload.src=s.file;}render();})();
